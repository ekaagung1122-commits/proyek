version: '3.8'
services:
  app:
    build: .
    ports:
      - "8084:80"
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CHATBOT_AI_ENABLED=${CHATBOT_AI_ENABLED:-true}
      - CHATBOT_AI_API_KEY=${CHATBOT_AI_API_KEY:-}
      - CHATBOT_AI_MODEL=${CHATBOT_AI_MODEL:-gemini-2.5-flash}
      - CHATBOT_AI_BASE_URL=${CHATBOT_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      - CHATBOT_AI_TIMEOUT=${CHATBOT_AI_TIMEOUT:-20}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - pendakian_db_data:/var/lib/mysql

volumes:
  pendakian_db_data: